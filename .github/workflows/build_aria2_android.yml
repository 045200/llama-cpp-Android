name: Build Aria2 Magisk Module (Android 15+ LTO)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config wget unzip

      # ========= 1. 设置 NDK r27d =========
      - name: 设置 Android NDK r27d
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r27d" >> $GITHUB_ENV

      # ========= 2. 编译 OpenSSL (静态, API 35, 启用 LTO) =========
      - name: 交叉编译 OpenSSL (arm64-v8a, LTO)
        run: |
          wget https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar -xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w

          export NDK=$ANDROID_NDK
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          # 软链接欺骗 OpenSSL Configure（NDK 无 gcc，实际是 clang）
          ln -sf aarch64-linux-android35-clang $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-gcc
          ln -sf aarch64-linux-android35-clang++ $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-g++

          export CC=aarch64-linux-android35-clang
          export CXX=aarch64-linux-android35-clang++
          export AR=aarch64-linux-android-ar
          export RANLIB=aarch64-linux-android-ranlib

          # 启用 LTO（-flto）和体积优化（-Os）
          export CFLAGS="-flto -Os -fPIC"
          export CXXFLAGS="-flto -Os -fPIC"
          export LDFLAGS="-flto"

          ./Configure android-arm64 -D__ANDROID_API__=35 no-shared no-tests -fPIC --prefix=$PWD/openssl-install
          make -j$(nproc)
          make install_sw

          echo "OPENSSL_DIR=$PWD/openssl-install" >> $GITHUB_ENV

      # ========= 3. 编译 aria2 (链接 OpenSSL, LTO) =========
      - name: 交叉编译 aria2c (arm64-v8a, LTO)
        run: |
          git clone https://github.com/aria2/aria2.git
          cd aria2
          ./autogen.sh

          export NDK=$ANDROID_NDK
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export AR=aarch64-linux-android-ar
          export CC=aarch64-linux-android35-clang
          export CXX=aarch64-linux-android35-clang++

          # LTO + 尺寸优化
          export CFLAGS="-flto -Os"
          export CXXFLAGS="-flto -Os"
          export LDFLAGS="-flto"

          ./configure --host=aarch64-linux-android \
                      --prefix=/usr \
                      --disable-shared \
                      --enable-static \
                      --with-openssl=$OPENSSL_DIR \
                      --without-gnutls \
                      --without-libxml2 \
                      --without-libexpat \
                      --without-sqlite3 \
                      --without-libgmp \
                      --without-libz \
                      --disable-epoll
          make -j$(nproc)

          # Strip 去除调试符号，进一步减小体积
          aarch64-linux-android-strip src/aria2c
          cp src/aria2c ../aria2c_binary

      # ========= 4. 下载 AriaNg =========
      - name: 下载 AriaNg Web UI
        run: |
          wget https://github.com/mayswind/AriaNg/releases/download/1.3.7/AriaNg-1.3.7.zip
          unzip AriaNg-1.3.7.zip -d AriaNg-dist

      # ========= 5. 打包 Magisk 模块 =========
      - name: 打包 Magisk 模块
        run: |
          MODDIR=module_temp
          mkdir -p $MODDIR/system/bin
          mkdir -p $MODDIR/system/usr/share/aria-ng
          mkdir -p $MODDIR/data/adb/aria2

          cp aria2c_binary $MODDIR/system/bin/aria2c
          chmod 755 $MODDIR/system/bin/aria2c
          cp -r AriaNg-dist/* $MODDIR/system/usr/share/aria-ng/

          cat > $MODDIR/module.prop <<EOF
          id=aria2_downloader
          name=Aria2 with HTTPS + AriaNg (Android 15+ LTO)
          version=v1.2
          versionCode=3
          author=YourName
          description=支持 HTTPS 的 aria2 下载器，集成 AriaNg Web 控制台，启用 LTO 和尺寸优化，适用于 Android 15+。
          EOF

          cat > $MODDIR/service.sh <<'EOF'
          #!/system/bin/sh
          sleep 10
          mkdir -p /data/adb/aria2
          if [ ! -f /data/adb/aria2/aria2.conf ]; then
            cat > /data/adb/aria2/aria2.conf <<CONF
          enable-rpc=true
          rpc-allow-origin-all=true
          rpc-listen-all=true
          rpc-listen-port=6800
          # rpc-secret=YourSecretToken
          dir=/sdcard/Download
          log=/data/adb/aria2/aria2.log
          log-level=notice
          max-concurrent-downloads=5
          max-connection-per-server=16
          split=16
          continue=true
          # check-certificate=false
          CONF
          fi
          /system/bin/aria2c --conf-path=/data/adb/aria2/aria2.conf -D
          if command -v busybox >/dev/null 2>&1; then
            busybox killall busybox httpd 2>/dev/null
            busybox httpd -p 8080 -h /system/usr/share/aria-ng -f &
            echo "AriaNg 已启动: http://127.0.0.1:8080"
          else
            echo "警告: 未找到 busybox，请安装 busybox 模块以使用 Web 界面。"
          fi
          EOF
          chmod 755 $MODDIR/service.sh

          cd $MODDIR
          zip -r ../Aria2-Magisk.zip ./*
          cd ..

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: Aria2-Magisk-Module
          path: Aria2-Magisk.zip