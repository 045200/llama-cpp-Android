name: Build Android Native arm64 llama-server (Magisk Module - Manual Control)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'llama.cpp 仓库 (owner/repo)'
        required: true
        default: 'ggml-org/llama.cpp'
      build_type:
        description: 'Release 或 Debug'
        required: true
        default: 'Release'
  schedule:
    - cron: '0 0 */3 * *'

env:
  REPO: ${{ github.event.inputs.repo || 'ggml-org/llama.cpp' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
  BUILD_DIR: build-android
  NDK_VERSION: r29
  MODULE_NAME: "llama-server-magisk"
  ARTIFACT_NAME: "llama-server-android-arm64-magisk"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v6
        with:
          path: current_repo

      - name: 生成仓库唯一标识（用于缓存隔离）
        id: repo_key
        run: |
          REPO="${{ env.REPO }}"
          echo "key=${REPO//\//_}" >> $GITHUB_OUTPUT

      - name: 安装 CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.x'

      - name: 安装 Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "=== Ninja 版本 ==="
          ninja --version

      # ============================================================
      # NDK r29 —— 优先用 runner 预装 (29.0.14206865)，无则 nttld 下载
      # 关键: 不再硬编码 r29 目录名; runner 用的是 29.x.x 数字版本号
      # ============================================================
      - name: 检测 NDK r29
        id: ndk
        run: |
          TC_REL="build/cmake/android.toolchain.cmake"
          NDK_BASE="/usr/local/lib/android/sdk/ndk"
          FOUND=""

          if [ -d "$NDK_BASE" ]; then
            for d in "$NDK_BASE"/29.*/; do
              d="${d%/}"
              if [ -f "$d/$TC_REL" ]; then
                FOUND="$d"
                break
              fi
            done
          fi

          if [ -n "$FOUND" ]; then
            echo "path=$FOUND" >> $GITHUB_OUTPUT
            echo "✓ runner 已预装 NDK r29: $FOUND"
          else
            echo "path=" >> $GITHUB_OUTPUT
            echo "runner 无预装 r29，将通过 nttld 下载"
          fi

      - name: 下载安装 Android NDK r29（仅无预装时）
        if: steps.ndk.outputs.path == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: 导出 NDK 环境变量并最终验证
        run: |
          TC_REL="build/cmake/android.toolchain.cmake"
          NDK_BASE="/usr/local/lib/android/sdk/ndk"
          FOUND="${{ steps.ndk.outputs.path }}"

          # 回退 1: nttld 设置的环境变量
          if [ -z "$FOUND" ] || [ ! -f "$FOUND/$TC_REL" ]; then
            if [ -n "$ANDROID_NDK_HOME" ] && [ -f "$ANDROID_NDK_HOME/$TC_REL" ]; then
              FOUND="$ANDROID_NDK_HOME"
            fi
          fi

          # 回退 2: 扫描 29.* 目录
          if [ -z "$FOUND" ] || [ ! -f "$FOUND/$TC_REL" ]; then
            for d in "$NDK_BASE"/29.*/; do
              d="${d%/}"
              [ -f "$d/$TC_REL" ] || continue
              FOUND="$d"
              break
            done
          fi

          if [ -z "$FOUND" ] || [ ! -f "$FOUND/$TC_REL" ]; then
            echo "✗ 未能定位 NDK r29"
            ls -la "$NDK_BASE" 2>/dev/null || echo "(目录不存在)"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$FOUND" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$FOUND" >> $GITHUB_ENV
          echo "NDK_PATH_RESOLVED=$FOUND" >> $GITHUB_ENV
          echo "$FOUND/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "✓ NDK r29 已就绪: $FOUND"

      - name: 构建工具综合校验
        run: |
          echo "=== 构建环境检查 ==="
          echo "CMake : $(cmake --version | head -n1)"
          echo "Ninja : $(ninja --version)"
          echo "NDK   : $NDK_PATH_RESOLVED"
          echo "编译器: $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || { echo "✗ clang 未找到"; exit 1; }
          echo "✓ 所有构建工具就绪"

      # ============================================================
      # 上游版本检测
      # ============================================================
      - name: 获取最新 Tag
        id: get_tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ env.REPO }}
          regex: '^b[0-9]+$'
          sort-tags: true

      - name: 恢复上次 Tag 缓存
        id: cache-restore
        uses: actions/cache@v5
        with:
          path: last_tag.txt
          key: last-tag-${{ steps.repo_key.outputs.key }}

      - name: 判断是否需要构建
        id: check
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.tag }}"
          if [ -z "$LATEST_TAG" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event_name }}" == "schedule" ]; then
            if [ -f last_tag.txt ] && [ "$(cat last_tag.txt)" = "$LATEST_TAG" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: 克隆 llama.cpp
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REPO }}
          ref: ${{ steps.check.outputs.latest_tag }}
          path: llama.cpp
          fetch-depth: 1

      # ============================================================
      # 编译 —— Redmi Note 12 Turbo / 骁龙 7+ Gen 2 专属优化
      # ============================================================
      - name: 配置编译（骁龙 7+ Gen 2 专属优化）
        if: steps.check.outputs.skip != 'true'
        working-directory: llama.cpp
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          cd ${{ env.BUILD_DIR }}
          # 说明：
          #   骁龙 7+ Gen 2 = 1× Cortex-X2 + 3× Cortex-A710 + 4× Cortex-A510
          #   全核支持 armv8.6-a + dotprod + i8mm + fp16 + bf16
          #   -march 统一由 GGML_CPU_ARM_ARCH 注入，避免重复
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_C_FLAGS="-O3" \
            -DCMAKE_CXX_FLAGS="-O3" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--no-keep-memory" \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU_ARM_ARCH="armv8.6-a+dotprod+i8mm+fp16+bf16" \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LLAMAFILE=ON \
            -DGGML_LTO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DANDROID_STL=c++_static \
            -DANDROID_ARM_NEON=ON \
            -DGGML_BLAS=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -G Ninja
          cmake --build . --config "${{ env.BUILD_TYPE }}" -j $(( $(nproc) / 2 + 1 ))

      - name: 捕获构建错误日志（仅失败时）
        if: failure() && steps.check.outputs.skip != 'true'
        run: |
          mkdir -p build-logs
          cp llama.cpp/${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log  build-logs/ 2>/dev/null || true
          cp llama.cpp/${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log build-logs/ 2>/dev/null || true
          cp llama.cpp/${{ env.BUILD_DIR }}/.ninja_log                 build-logs/ 2>/dev/null || true
          ls -la build-logs/

      - name: 上传构建失败日志（如有）
        if: failure() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: 剥离调试符号并准备二进制
        if: steps.check.outputs.skip != 'true' && success()
        run: |
          cp llama.cpp/${{ env.BUILD_DIR }}/bin/llama-server ./llama-server
          chmod +x ./llama-server
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug ./llama-server
          echo "二进制大小:"
          ls -lh ./llama-server

      # ============================================================
      # 构建 Magisk 模块
      # ============================================================
      - name: 构建 Magisk 模块
        if: steps.check.outputs.skip != 'true' && success()
        run: |
          MAGISK_SRC="${{ github.workspace }}/current_repo/magisk"
          if [ ! -d "$MAGISK_SRC" ]; then
            echo "错误: 仓库根目录缺少 magisk/ 文件夹（检查路径: $MAGISK_SRC）"
            exit 1
          fi

          MODULE_DIR="${{ env.MODULE_NAME }}"
          mkdir -p "$MODULE_DIR"
          cp -r "$MAGISK_SRC"/* "$MODULE_DIR/"
          cp ./llama-server "$MODULE_DIR/"
          chmod 755 "$MODULE_DIR/llama-server"

          if [ -f "$MODULE_DIR/module.prop" ]; then
            sed -i "s/^version=.*/version=${{ steps.check.outputs.latest_tag }}/" "$MODULE_DIR/module.prop"
            sed -i "s/^versionCode=.*/versionCode=$(date +%Y%m%d%H%M)/" "$MODULE_DIR/module.prop"
          fi

          find "$MODULE_DIR" -name "*.sh" -exec chmod 755 {} \;
          chmod 755 "$MODULE_DIR/system/bin/llama-server" 2>/dev/null || true

          cd "$MODULE_DIR"
          zip -r9 "../${{ env.MODULE_NAME }}.zip" ./*
          cd ..
          sha256sum "${{ env.MODULE_NAME }}.zip" > "${{ env.MODULE_NAME }}.zip.sha256"

      - name: 上传 Magisk 模块 Artifact
        if: steps.check.outputs.skip != 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.MODULE_NAME }}.zip
            ${{ env.MODULE_NAME }}.zip.sha256
          retention-days: 15

      - name: 发布 Release
        if: steps.check.outputs.skip != 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.check.outputs.latest_tag }}
          name: llama-server Magisk Module (手动启停) - ${{ steps.check.outputs.latest_tag }}
          body: |
            ## 🚀 Magisk 模块发布 — 手动启停版（Redmi Note 12 Turbo 优化）

            **上游版本**: ${{ steps.check.outputs.latest_tag }}
            **NDK**: r29 (${{ env.NDK_VERSION }})

            ### 📦 安装方式
            1. 下载 `${{ env.MODULE_NAME }}.zip`
            2. 在 Magisk Manager 中刷入模块
            3. 重启设备
            4. 将 `.gguf` 模型放入 `/data/llama/models/` 目录
            5. **打开 Magisk → 模块 → llama-server → 点击「运行」按钮**
            6. 弹窗提示后：
               - **音量上键** → 启动 / 停止服务
               - **音量下键** → 取消退出

            ### 🎮 手动控制说明
            本模块**不再开机自动启动**，改为通过 Magisk 模块的「运行」按钮手动控制。
            每次点击「运行」按钮，脚本会检测服务当前状态：

            | 当前状态 | 按音量上 | 按音量下 |
            |---------|---------|---------|
            | 未运行  | 启动服务 | 退出    |
            | 运行中  | 停止服务 | 退出    |

            等待按键最长 30 秒，超时自动退出，不执行任何操作。

            ### ⚙️ 技术特性
            - **无 OpenMP 依赖**，避免静态链接导致的运行时崩溃
            - **KleidiAI 微内核优化** + **llamafile SGEMM** + **LTO 链接时优化**
            - **C++ STL 静态链接** (c++_static)，无外部 .so 依赖
            - **指令集**: `armv8.6-a+dotprod+i8mm+fp16+bf16`
            - **深度适配 Redmi Note 12 Turbo（骁龙 7+ Gen 2）**
              - 1× Cortex-X2 + 3× Cortex-A710 + 4× Cortex-A510
              - 全核支持 bf16，启用后可加速 bf16 量化推理
            - **OOM 优先级保护** (oom_score_adj=-1000，防止被系统强杀)
            - **手动启停**：按需运行，节省内存与电量

            ### 📱 平台要求
            - Android arm64-v8a (API 28+)
            - Magisk 24.0+
            - 推荐机型: **Redmi Note 12 Turbo**（其他 armv8.6 设备也可通用）

            ### 🔧 文件安装位置
            | 项目 | 路径 |
            |------|------|
            | 二进制 | `/data/llama/llama-server` |
            | 模型目录 | `/data/llama/models/` |
            | 全局命令 | `llama-server` (已加入 PATH) |
            | 控制脚本 | `/data/adb/modules/llama-server/action.sh` |
            | 运行日志 | `/data/llama/llama.log` |

            ### 💡 命令行手动控制（备用）
            ```bash
            # 启动（推荐参数，已针对 7+ Gen 2 调优）
            nohup /data/llama/llama-server \
              -m /data/llama/models/你的模型.gguf \
              -c 2048 -t 4 --no-mmap --log-verbosity 0 \
              --host 0.0.0.0 --port 8080 \
              > /data/llama/llama.log 2>&1 &

            # 停止
            pkill -f "llama-server -m"

            # 查看日志
            tail -f /data/llama/llama.log
            ```

            ### 🔗 与 Rust 程序配合使用
            API 地址: `http://127.0.0.1:8080`

            **SHA256**: `$(cat ${{ env.MODULE_NAME }}.zip.sha256 | awk '{print $1}')`
          files: |
            ${{ env.MODULE_NAME }}.zip
            ${{ env.MODULE_NAME }}.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

      - name: 清理旧 Releases（保留最新 3 个 android-* 前缀）
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName' | while read tag; do
            if [[ "$tag" == android-* ]]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done

      - name: 清理旧 Workflow Runs（保留最新 3 条）
        if: success()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: 保存本次 Tag
        if: steps.check.outputs.skip != 'true' && success()
        run: echo "${{ steps.check.outputs.latest_tag }}" > last_tag.txt

      - name: 缓存 Tag
        if: steps.check.outputs.skip != 'true' && success()
        uses: actions/cache@v5
        with:
          path: last_tag.txt
          key: last-tag-${{ steps.repo_key.outputs.key }}